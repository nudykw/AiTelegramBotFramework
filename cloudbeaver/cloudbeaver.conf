{
    "server": {
        "serverPort": 8978,
        "forceHttps": false,
        "contentRoot": "web",
        "driversLocation": "drivers",
        "sslConfigurationPath": "workspace/.data/ssl-config.xml",
        "rootURI": "/",
        "serviceURI": "/api/",
        "supportedHosts": [],
        "productSettings": {
            "core.theming.theme": "system",
            "core.localization.language": "en",
            "plugin.sql-editor.autoSave": true,
            "plugin.sql-editor.disabled": false,
            "plugin.sql-editor.maxFileSize": 10240,
            "plugin.log-viewer.disabled": false,
            "plugin.log-viewer.logBatchSize": 1000,
            "plugin.log-viewer.maxLogRecords": 2000,
            "sql.proposals.insert.table.alias": "PLAIN",
            "SQLEditor.ContentAssistant.experimental.mode": "NEW"
        },
        "expireSessionAfterPeriod": 1800000,
        "bindSessionToIp": "disable",
        "develMode": false,
        "enableSecurityManager": false,
        "sm": {
            "enableBruteForceProtection": true,
            "maxFailedLogin": 10,
            "minimumLoginTimeout": 1,
            "blockLoginPeriod": 300,
            "passwordPolicy": {
                "minLength": 8,
                "requireMixedCase": true,
                "minNumberCount": 1,
                "minSymbolCount": 0
            }
        },
        "database": {
            "driver": "h2_embedded_v2",
            "url": "jdbc:h2:./workspace/.data/cb.h2v2.dat",
            "schema": "",
            "user": "",
            "password": "",
            "initialDataConfiguration": "conf/initial-data.conf",
            "pool": {
                "minIdleConnections": 4,
                "maxIdleConnections": 10,
                "maxConnections": 100,
                "validationQuery": "SELECT 1"
            },
            "backupEnabled": true
        }
    },
    "app": {
        "anonymousAccessEnabled": "true",
        "anonymousUserRole": "user",
        "defaultUserTeam": "user",
        "grantConnectionsAccessToAnonymousTeam": false,
        "supportsCustomConnections": "true",
        "showReadOnlyConnectionInfo": false,
        "systemVariablesResolvingEnabled": false,
        "forwardProxy": false,
        "publicCredentialsSaveEnabled": true,
        "adminCredentialsSaveEnabled": true,
        "resourceManagerEnabled": true,
        "resourceQuotas": {
            "resourceManagerFileSizeLimit": 500000,
            "sqlMaxRunningQueries": 100,
            "sqlResultSetRowsLimit": 100000,
            "sqlTextPreviewMaxLength": 4096,
            "sqlBinaryPreviewMaxLength": 261120
        },
        "enabledAuthProviders": [
            "local"
        ],
        "disabledBetaFeatures": []
    }
}
